version: 0.2

# Image-worker build. ~30-45 min cold, <10 min warm with registry layer cache.
# Compute: BUILD_GENERAL1_LARGE (15 GB RAM, 8 vCPU). Cost: ~$0.30 per cold build.

env:
  variables:
    REPO_NAME: "comfy-image-worker"

phases:
  pre_build:
    commands:
      - echo Logging in to ECR
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
      - export REPO="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$REPO_NAME"
      - export SHA="$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - if [ -z "$SHA" ]; then export SHA="$(date -u +%Y%m%d%H%M%S)"; fi
      - echo Building "$REPO:$SHA"
      - docker buildx create --use --name comfy-builder || docker buildx use comfy-builder

  build:
    commands:
      - echo Build started on `date`
      - docker buildx build --file workers/image/Dockerfile --tag "$REPO:$SHA" --tag "$REPO:latest" --cache-from "type=registry,ref=$REPO:cache" --cache-to "type=registry,ref=$REPO:cache,mode=max" --push .

  post_build:
    commands:
      - echo Build complete tag "$REPO:$SHA"
      - echo To roll out, pin "$SHA" as fleets.image.imageTag in infra/lib/config.ts and deploy ComfyComputeStack. Task defs pin by SHA - force-new-deployment re-runs the OLD image.
      # Re-bake the golden AMI so it tracks the new :latest (the AMI's payload IS
      # this image). Non-fatal: a trigger hiccup must not fail an already-pushed
      # build. ARN built from CodeBuild's ACCOUNT/AWS_REGION; pipeline name is
      # fixed in infra (GOLDEN_PIPELINE_NAME). No-op until ComfyImageBuilderStack
      # is deployed (the IAM grant lives on the shared CodeBuild role).
      - echo Triggering golden AMI re-bake
      - aws imagebuilder start-image-pipeline-execution --image-pipeline-arn "arn:aws:imagebuilder:$AWS_REGION:$ACCOUNT:image-pipeline/comfy-image-golden-pipeline" --region "$AWS_REGION" || echo "re-bake trigger failed (non-fatal)"
