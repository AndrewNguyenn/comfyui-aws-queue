<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ComfyUI · Outputs</title>
<meta name="color-scheme" content="light only" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ===== Kenrokuen tokens (from the design's colors_and_type.css) ===== */
:root {
  color-scheme: light;
  --paper:#eef2ec; --paper-2:#e4ebe3; --cream:#f6f8f3;
  --ink:#1f2a26; --ink-2:#4a5752; --ink-3:#8a9690;
  --line:#c7d2c9; --line-2:#d9e1d8; --border-strong:#a7b6ab;
  --pond:#4a7989; --pond-dk:#2d5a6b; --pond-lt:#8fb3bf; --deep:#1e3e4a;
  --moss:#6d8551; --pine:#4a5f3a; --maple:#b5614a; --stone:#9aa3a0;
  --font-display:'Fraunces',Georgia,serif;
  --font-ui:'Inter',-apple-system,system-ui,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',ui-monospace,Menlo,monospace;
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-ui); font-size:14px; -webkit-font-smoothing:antialiased; }
img, video { display:block; max-width:100%; }
button { font:inherit; color:inherit; background:transparent; border:0; padding:0; cursor:pointer; }
input { font:inherit; color:inherit; }
a { color:var(--pond-dk); }

.app { max-width:1480px; margin:0 auto; padding:28px 32px 80px; }

/* ===== Header ===== */
.hdr { display:grid; grid-template-columns:1fr auto; align-items:end;
  padding:6px 0 18px; border-bottom:1px solid var(--line); }
.hdr .brand { font-weight:600; font-size:10.5px; letter-spacing:.32em;
  text-transform:uppercase; color:var(--pond-dk); }
.hdr .title { font-family:var(--font-display); font-style:italic; font-weight:500;
  font-size:44px; line-height:1; letter-spacing:-.01em; color:var(--ink); margin-top:6px; }
.hdr .sub { font-size:12.5px; color:var(--ink-3); margin-top:8px; }
.hdr .rhs { text-align:right; font-family:var(--font-mono); font-size:11px;
  color:var(--ink-3); line-height:1.9; letter-spacing:.04em; }
.hdr .rhs b { color:var(--ink); font-weight:500; }
.hdr .stamp { display:inline-flex; align-items:center; font-family:var(--font-ui);
  font-size:9px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
  padding:4px 8px; border:1px solid var(--pine); color:var(--pine); margin-left:10px; }
.hdr .stamp .dot { width:5px; height:5px; background:var(--pine); margin-right:6px;
  display:inline-block; }

/* ===========================================================
   Pending workflows panel — the running job featured with a
   live progress meter, the queue collapsed to one row per
   model. Every row carries a cancel (×) action.
   =========================================================== */
.pending { margin-top:18px; border:1px solid var(--line); background:var(--paper); }
.pending-hd { display:flex; align-items:baseline; justify-content:space-between;
  padding:12px 16px; background:var(--paper-2); border-bottom:1px solid var(--line); }
.pending-hd .lhs { display:flex; align-items:baseline; gap:14px; min-width:0; }
.pending-hd .eyebrow { font-size:9px; font-weight:600; letter-spacing:.22em;
  text-transform:uppercase; color:var(--ink-3); flex-shrink:0; }
.pending-hd .summary { font-family:var(--font-display); font-style:italic;
  font-weight:500; font-size:16px; color:var(--ink); line-height:1.2;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pending-hd .summary .sep { color:var(--ink-3); font-style:normal; margin:0 6px; }
.pending-hd .summary .eta { font-family:var(--font-mono); font-style:normal;
  font-size:11px; color:var(--ink-3); letter-spacing:.04em; margin-left:6px; }
.pending-hd .rhs { display:flex; align-items:center; gap:12px; flex-shrink:0; }
.pending-hd .status-stamp { display:inline-flex; align-items:center; font-size:9px;
  font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--pine);
  border:1px solid var(--pine); padding:4px 8px; }
.pending-hd .status-stamp .dot { width:5px; height:5px; background:var(--pine);
  margin-right:6px; display:inline-block; animation:pulse-dot 1.6s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1;} 50%{opacity:.3;} }
.pending-hd .collapse { font-size:10px; font-weight:600; letter-spacing:.22em;
  text-transform:uppercase; color:var(--pond-dk); padding:4px 0 4px 12px;
  border-left:1px solid var(--line); transition:color .12s; }
.pending-hd .collapse:hover { color:var(--ink); }
.pending.collapsed .pending-body, .pending.collapsed .pq-foot { display:none; }

/* One row — running or queued — on a 5-col rhythm:
   stamp | name + meta | progress meter | eta | cancel */
.pq-row { display:grid;
  grid-template-columns:72px minmax(0,1fr) minmax(140px,220px) 80px 32px;
  gap:18px; align-items:center; padding:11px 16px; max-height:90px;
  border-bottom:1px solid var(--line-2); transition:background .1s; }
.pq-row:last-child { border-bottom:0; }
.pq-row.queued:hover { background:var(--paper-2); }
.pq-stamp { font-size:9px; font-weight:600; letter-spacing:.22em;
  text-transform:uppercase; border:1px solid currentColor; padding:4px 7px;
  text-align:center; width:fit-content; color:var(--ink-3); }
.pq-row.running .pq-stamp { color:var(--pond-dk); }
.pq-row.cancelling .pq-stamp { color:var(--maple); }
.pq-name { display:flex; align-items:baseline; gap:10px; min-width:0; }
.pq-name .kindchip { font-size:8px; font-weight:600; letter-spacing:.22em;
  text-transform:uppercase; color:var(--ink-3); border:1px solid var(--line);
  padding:2px 5px; flex-shrink:0; align-self:center; }
.pq-name .kindchip.vid { color:var(--maple); border-color:var(--maple); }
.pq-name .kindchip.img { color:var(--pond-dk); border-color:var(--pond-lt); }
.pq-name .model { font-family:var(--font-display); font-style:italic; font-weight:500;
  font-size:16px; color:var(--ink); line-height:1.2; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; min-width:0; }
.pq-name .batchchip { font-family:var(--font-mono); font-size:10px; color:var(--ink-3);
  letter-spacing:.04em; flex-shrink:0; }
.pq-name .batchchip .ct { color:var(--pond-dk); }
/* GPU instance type on the running row — a quiet mono tag. */
.pq-name .pq-instance { font-family:var(--font-mono); font-size:9.5px;
  color:var(--moss); letter-spacing:.04em; flex-shrink:0; border:1px solid var(--line);
  padding:2px 6px; align-self:center; }
.pq-meter { position:relative; height:3px; background:var(--line-2); width:100%;
  overflow:hidden; }
.pq-meter .fill { position:absolute; inset:0; background:var(--pond);
  width:var(--pct,0%); transition:width .4s ease; }
.pq-meter .fill::after { content:""; position:absolute; top:0; bottom:0; right:-10px;
  width:20px; background:linear-gradient(90deg,transparent,var(--pond-lt) 60%,transparent);
  animation:shimmer 1.6s ease-in-out infinite; }
/* No progress yet — an indeterminate sliding bar. */
.pq-meter.indet .fill { width:38%; animation:pq-slide 1.5s ease-in-out infinite; }
.pq-meter.indet .fill::after { display:none; }
@keyframes shimmer { 0%{opacity:0;transform:translateX(-8px);} 50%{opacity:.8;}
  100%{opacity:0;transform:translateX(8px);} }
@keyframes pq-slide { 0%{left:-38%;} 100%{left:100%;} }
.pq-row.queued .pq-meter { background:var(--line-2); height:1px; }
.pq-row.cancelling .pq-meter .fill { background:var(--stone); }
.pq-row.cancelling .pq-meter .fill::after { display:none; }
.pq-eta { font-family:var(--font-mono); font-size:11px; color:var(--ink-2);
  letter-spacing:.04em; text-align:right; white-space:nowrap; }
.pq-row.running .pq-eta { color:var(--ink); }
.pq-row.running .pq-eta .step { display:block; font-family:var(--font-ui); font-size:9px;
  font-weight:600; letter-spacing:.22em; text-transform:uppercase; color:var(--ink-3);
  margin-bottom:2px; }
.pq-row.queued .pq-eta { color:var(--ink-3); }
/* Failed row — a maple stamp, the error spanning the meter+eta columns. */
.pq-row.failed { background:rgba(181,97,74,.055); }
.pq-row.failed .pq-stamp { color:var(--maple); }
.pq-row.failed .pq-act { opacity:1; }
.pq-err { grid-column:3 / 5; font-family:var(--font-mono); font-size:10.5px;
  color:var(--maple); letter-spacing:.02em; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; min-width:0; }
.pending-hd .summary .failnote { color:var(--maple); font-style:normal; }
/* Cancel / remove action — on every row. Maple on hover. */
.pq-act { width:28px; height:28px; display:flex; align-items:center;
  justify-content:center; border:1px solid var(--line); color:var(--ink-3); opacity:0;
  transition:opacity .12s,color .12s,border-color .12s,background .12s; }
.pq-row:hover .pq-act { opacity:1; }
.pq-act:hover:not(:disabled) { color:var(--maple); border-color:var(--maple); }
.pq-act:active:not(:disabled) { background:var(--maple); color:var(--cream); }
.pq-act:disabled { opacity:.35; cursor:default; }
.pq-act svg { width:13px; height:13px; }
.pq-row.removing { animation:pq-collapse .26s ease-in forwards; pointer-events:none; }
@keyframes pq-collapse { to { opacity:0; padding-top:0; padding-bottom:0;
  max-height:0; transform:translateX(-8px); } }
/* Reveal-more footer */
.pq-foot { display:flex; align-items:center; justify-content:space-between;
  padding:10px 16px 12px; border-top:1px solid var(--line-2); background:var(--paper-2); }
.pq-foot .more { font-size:10px; font-weight:600; letter-spacing:.22em;
  text-transform:uppercase; color:var(--pond-dk); }
.pq-foot .more:hover { color:var(--ink); }
.pq-foot .total { font-family:var(--font-mono); font-size:10px; color:var(--ink-3);
  letter-spacing:.06em; }
.pq-empty { padding:13px 16px; font-size:12px; color:var(--ink-3);
  font-family:var(--font-display); font-style:italic; }

/* ===== Tabs ===== */
.tabs { display:flex; border-bottom:1px solid var(--line); margin-top:18px; }
.tab { display:flex; align-items:baseline; gap:10px; padding:16px 22px 14px;
  font-size:11px; font-weight:600; letter-spacing:.22em; text-transform:uppercase;
  color:var(--ink-3); border-bottom:1px solid transparent; margin-bottom:-1px;
  cursor:pointer; transition:color .15s; }
.tab:hover { color:var(--ink-2); }
.tab.active { color:var(--pond-dk); border-bottom-color:var(--pond-dk); }
.tab .count { font-family:var(--font-mono); font-size:10.5px; color:var(--ink-3); font-weight:400; }
.tab.active .count { color:var(--pond); }

/* ===== Toolbar ===== */
.toolbar { display:flex; gap:14px; align-items:center; padding:14px;
  background:var(--paper-2); border:1px solid var(--line); border-top:0; }
.search { display:flex; align-items:center; gap:10px; flex:1; min-width:0; }
.search svg { width:14px; height:14px; flex-shrink:0; color:var(--ink-3); }
.search input { flex:1; border:0; background:transparent; outline:0;
  font-family:var(--font-display); font-style:italic; font-size:17px; color:var(--ink);
  min-width:0; }
.search input::placeholder { color:var(--ink-3); font-style:italic; }
.tool-btn { font-family:var(--font-ui); font-size:10px; font-weight:600;
  letter-spacing:.18em; text-transform:uppercase; padding:9px 16px;
  border:1px solid var(--line); color:var(--ink-2); background:transparent;
  cursor:pointer; white-space:nowrap; flex-shrink:0; }
.tool-btn:hover { border-color:var(--ink); color:var(--ink); }
.tool-btn.active { border-color:var(--pond-dk); color:var(--pond-dk);
  background:var(--cream); }

/* ===== Multi-select ===== */
.card .checkbox { position:absolute; top:8px; left:8px; width:22px; height:22px;
  border:1px solid var(--ink); background:var(--paper); display:flex;
  align-items:center; justify-content:center; opacity:0; transition:opacity .12s;
  cursor:pointer; z-index:3; }
.card:hover .checkbox, .grid.selectmode .card .checkbox,
.card.selected .checkbox { opacity:1; }
.card .checkbox svg { width:13px; height:13px; color:var(--paper); }
.card.selected .checkbox { background:var(--pond-dk); border-color:var(--pond-dk); }
.card.selected { outline:2px solid var(--pond-dk); outline-offset:-2px; }
.thumb-wrap .ph.ph-failed { color:var(--maple); cursor:pointer; }
.selbar { position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  z-index:60; display:flex; align-items:center; gap:22px; background:var(--ink);
  border:1px solid var(--ink); padding:12px 20px; }
.selbar .sb-lhs { font-family:var(--font-ui); font-size:11px; font-weight:500;
  letter-spacing:.14em; text-transform:uppercase; color:var(--paper-2); }
.selbar .sb-ct { font-family:var(--font-display); font-style:italic;
  font-size:20px; font-weight:600; color:var(--cream); margin-right:5px;
  font-variant-numeric:tabular-nums; }
.selbar .sb-rhs { display:flex; gap:8px; }
.selbar button { font-family:var(--font-ui); font-size:10px; font-weight:600;
  letter-spacing:.18em; text-transform:uppercase; padding:9px 15px;
  border:1px solid rgba(246,248,243,.32); background:transparent;
  color:var(--cream); cursor:pointer; }
.selbar button:hover { border-color:var(--cream); }
.selbar button.primary { border-color:var(--pond-lt); color:var(--pond-lt); }
.selbar button.primary:hover { background:var(--pond-lt); color:var(--ink);
  border-color:var(--pond-lt); }
.selbar button:disabled { opacity:.4; pointer-events:none; }

/* ===== Grid + cards ===== */
.grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:14px;
  border:1px solid var(--line); border-top:0; padding:14px; }
.card { background:var(--paper); border:1px solid var(--line); display:flex;
  flex-direction:column; position:relative; cursor:pointer; transition:border-color .12s;
  min-width:0; }
.card:hover { border-color:var(--border-strong); }
.card.deleting { opacity:.35; pointer-events:none; }
.card .thumb-wrap { position:relative; width:100%; aspect-ratio:1/1;
  background:var(--cream); border-bottom:1px solid var(--line); overflow:hidden; }
/* contain, not cover — show the whole generation (portraits/landscapes are
   letterboxed against the cream tile) rather than centre-cropping it square. */
.card .thumb-wrap img, .card .thumb-wrap video { width:100%; height:100%;
  object-fit:contain; }
.card .thumb-wrap .ph { display:flex; align-items:center; justify-content:center;
  height:100%; font-family:var(--font-mono); font-size:9px; color:var(--ink-3); }
.card .typestamp { position:absolute; top:6px; right:6px; font-size:9px; font-weight:600;
  letter-spacing:.22em; text-transform:uppercase; padding:3px 7px; border:1px solid currentColor;
  background:rgba(246,248,243,.92); }
.card .typestamp.img { color:var(--pond-dk); }
.card .typestamp.vid { color:var(--maple); }
.card .play { position:absolute; inset:0; display:flex; align-items:center;
  justify-content:center; pointer-events:none; }
.card .play svg { width:46px; height:46px; color:var(--cream);
  filter:drop-shadow(0 1px 4px rgba(31,42,38,.5)); }
.card .thumb-actions { position:absolute; bottom:8px; left:8px; display:flex; gap:6px;
  opacity:0; transition:opacity .12s; z-index:2; }
.card:hover .thumb-actions { opacity:1; }
.card .thumb-actions button { width:28px; height:28px; display:flex; align-items:center;
  justify-content:center; background:rgba(246,248,243,.94); border:1px solid var(--line);
  color:var(--ink); }
.card .thumb-actions button.danger:hover { border-color:var(--maple); color:var(--maple); }
.card .thumb-actions svg { width:13px; height:13px; }
.card .body { padding:10px 12px 12px; }
.card .name { font-family:var(--font-display); font-style:italic; font-weight:500;
  font-size:14px; color:var(--ink); line-height:1.25; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; }
.card .meta-row { display:flex; align-items:center; gap:7px; font-family:var(--font-mono);
  font-size:9.5px; color:var(--ink-3); letter-spacing:.04em; margin-top:5px; }
.card .meta-row .sep { opacity:.6; }

/* ===== Empty + pager ===== */
.empty { border:1px solid var(--line); border-top:0; background:var(--paper-2);
  padding:70px 32px; text-align:center; }
.empty .e-eyebrow { font-size:9px; font-weight:600; letter-spacing:.22em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:12px; }
.empty .e-title { font-family:var(--font-display); font-style:italic; font-weight:500;
  font-size:26px; color:var(--ink); }
.empty .e-body { font-size:13px; color:var(--ink-2); margin-top:8px; }
.pager { display:flex; gap:16px; align-items:center; justify-content:center;
  padding:18px 0; font-family:var(--font-mono); font-size:11px; color:var(--ink-3);
  letter-spacing:.04em; }
.pager button { padding:7px 14px; border:1px solid var(--line); color:var(--pond-dk);
  font-family:var(--font-ui); font-size:10px; font-weight:600; letter-spacing:.18em;
  text-transform:uppercase; }
.pager button:hover:not(:disabled) { background:var(--pond-dk); color:var(--paper); }
.pager button:disabled { opacity:.35; cursor:default; }
.pg-nums { display:flex; flex-wrap:wrap; gap:4px; justify-content:center; }
.pager-top { border-bottom:1px solid var(--line); }
.pager .pg-num { padding:7px 10px; min-width:34px; letter-spacing:0; text-align:center; }
.pager .pg-num.active { background:var(--pond-dk); color:var(--paper); cursor:default; }
.pg-gap { color:var(--ink-3); padding:0 2px; align-self:center; }
.pg-count { color:var(--ink-3); }

/* ===== Modal =====
   The stage and the info panel are independent scroll regions. The grid row
   is pinned to the modal height (minmax(0,1fr)) so a long prompt can't stretch
   the modal — the info panel's body scrolls instead, while the stage holds its
   own height and keeps the image centred and fully visible. */
.scrim { position:fixed; inset:0; background:rgba(15,22,19,.72); z-index:50;
  display:flex; }
.modal { flex:1; display:grid; grid-template-columns:1fr 320px;
  grid-template-rows:minmax(0,1fr); background:var(--paper);
  margin:28px auto; border:1px solid var(--ink); overflow:hidden; max-width:1300px;
  width:calc(100% - 56px); }
.modal .stage { background:var(--ink); display:flex; align-items:center;
  justify-content:center; position:relative; padding:28px; min-height:0;
  overflow:hidden; }
.modal .stage img, .modal .stage video { max-width:100%; max-height:100%;
  object-fit:contain; background:var(--cream); }
.modal .stage .nav { position:absolute; top:50%; transform:translateY(-50%);
  width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--ink-3); color:var(--cream); background:rgba(31,42,38,.6);
  font-family:var(--font-display); font-style:italic; font-size:22px; }
.modal .stage .nav:hover:not(:disabled) { border-color:var(--cream); }
.modal .stage .nav.prev { left:14px; } .modal .stage .nav.next { right:14px; }
.modal .stage .nav:disabled { opacity:.3; cursor:default; }
.modal .info { border-left:1px solid var(--line); display:flex; flex-direction:column;
  min-height:0; }
.modal .info-head { padding:20px 22px 16px; border-bottom:1px solid var(--line); }
.modal .info-head .eyebrow { font-size:9px; font-weight:600; letter-spacing:.22em;
  text-transform:uppercase; color:var(--ink-3); margin-bottom:8px; }
.modal .info-head h2 { margin:0; font-family:var(--font-display); font-style:italic;
  font-weight:500; font-size:20px; color:var(--ink); line-height:1.2; word-break:break-all; }
.modal .info .close { position:absolute; top:40px; right:44px; width:34px; height:34px;
  display:flex; align-items:center; justify-content:center; border:1px solid var(--line);
  background:var(--paper); color:var(--ink-2); }
.modal .info .close:hover { border-color:var(--ink); color:var(--ink); }
.modal .info-body { padding:18px 22px; overflow-y:auto; flex:1; }
.modal .field { display:grid; grid-template-columns:90px 1fr; gap:14px; padding:9px 0;
  border-bottom:1px solid var(--line-2); align-items:baseline; }
.modal .field .k { font-size:9.5px; font-weight:600; letter-spacing:.22em;
  text-transform:uppercase; color:var(--ink-3); }
.modal .field .v { font-family:var(--font-mono); font-size:11.5px; color:var(--ink);
  letter-spacing:.04em; word-break:break-word; }
.modal .section-ttl { font-family:var(--font-ui); font-size:9px; font-weight:600;
  letter-spacing:.22em; text-transform:uppercase; color:var(--ink-3); margin:22px 0 8px; }
.modal .prompt { font-family:var(--font-display); font-style:italic; font-size:15px;
  color:var(--ink); line-height:1.55; background:var(--paper-2); padding:14px;
  border:1px solid var(--line); white-space:pre-wrap; word-break:break-word; }
.modal .prompt.neg { color:var(--ink-2); font-size:13px; }
.modal .prompt.muted { font-family:var(--font-ui); font-style:normal; font-size:11.5px;
  color:var(--ink-3); }
.modal .prompt-ttl { display:flex; align-items:center; justify-content:space-between;
  gap:10px; }
.prompt-copy { flex-shrink:0; width:26px; height:26px; padding:0; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--line); background:transparent; color:var(--ink-3); }
.prompt-copy svg { width:14px; height:14px; }
.prompt-copy:hover { border-color:var(--ink); color:var(--ink); }
.prompt-copy.copied { border-color:var(--pond-dk); color:var(--pond-dk); }
.modal .info-foot { padding:14px 22px; border-top:1px solid var(--line); display:flex;
  flex-wrap:wrap; gap:8px; }
.modal .info-foot button { font-size:10px; font-weight:600; letter-spacing:.18em;
  text-transform:uppercase; padding:9px 13px; border:1px solid var(--line); color:var(--ink); }
.modal .info-foot button:hover { border-color:var(--ink); }
.modal .info-foot button.danger { border-color:var(--maple); color:var(--maple); }
.modal .info-foot button.danger:hover { background:var(--maple); color:var(--cream); }

/* ===== Confirm + toast ===== */
.confirm-scrim { position:fixed; inset:0; z-index:100; background:rgba(15,22,19,.5);
  display:flex; align-items:center; justify-content:center; padding:24px; }
.confirm { background:var(--paper); border:1px solid var(--ink); width:440px;
  max-width:100%; padding:26px; box-shadow:0 30px 60px rgba(0,0,0,.4); }
.confirm .eyebrow { font-size:9px; font-weight:600; letter-spacing:.22em;
  text-transform:uppercase; color:var(--maple); margin-bottom:12px; }
.confirm h3 { margin:0; font-family:var(--font-display); font-style:italic; font-weight:500;
  font-size:24px; color:var(--ink); line-height:1.15; }
.confirm p { margin:12px 0 0; font-size:13px; color:var(--ink-2); line-height:1.55; }
.confirm .cf-foot { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
.confirm .cf-foot button { font-size:10px; font-weight:600; letter-spacing:.18em;
  text-transform:uppercase; padding:9px 15px; border:1px solid var(--line); color:var(--ink); }
.confirm .cf-foot button.danger { border-color:var(--maple); color:var(--maple); }
.confirm .cf-foot button.danger:hover { background:var(--maple); color:var(--cream); }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--cream); border:1px solid var(--pine);
  padding:12px 20px; font-family:var(--font-display); font-style:italic; font-size:16px;
  z-index:200; box-shadow:0 12px 32px rgba(0,0,0,.4); }

/* ===========================================================
   Responsive — tablet (≤ 920px)
   Header collapses to one column; modal drops to a single
   column — the stage on top (height-capped), the info panel
   below as its own scroll region.
   =========================================================== */
@media (max-width:920px) {
  .app { padding:20px 18px 60px; }
  .hdr { grid-template-columns:1fr; gap:14px; }
  .hdr .rhs { text-align:left; }
  .grid { grid-template-columns:repeat(4,minmax(0,1fr)); }
  .modal { grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr);
    margin:16px; width:calc(100% - 32px); }
  .modal .stage { max-height:55vh; }
  .modal .info { border-left:0; border-top:1px solid var(--line); }
}

/* ===========================================================
   Responsive — phone (≤ 640px)
   The layout retunes for thumbs:
   - Header collapses; meta wraps below the title
   - Tabs become full-width equal segments
   - Grid is fixed 2-up; card actions stay visible (no hover)
   - Modal becomes a full-screen vertical sheet: stage on top
     (aspect-capped), scrollable info below, sticky action bar
   - Toast stretches edge-to-edge
   =========================================================== */
@media (max-width:640px) {
  body { font-size:13px; }
  .app { padding:14px 14px 100px; }

  /* Header */
  .hdr { padding:4px 0 14px; }
  .hdr .brand { font-size:9.5px; letter-spacing:.28em; }
  .hdr .title { font-size:32px; margin-top:4px; }
  .hdr .sub { font-size:11.5px; margin-top:6px; }
  .hdr .rhs { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px;
    font-size:10px; line-height:1.4; margin-top:10px; }
  .hdr .stamp { margin-left:0; }

  /* Pending panel — stack the header, wrap rows onto a meter line */
  .pending { margin-top:14px; }
  .pending-hd { padding:10px 12px; flex-wrap:wrap; gap:6px 10px; }
  .pending-hd .lhs { flex:1 1 100%; gap:10px; }
  .pending-hd .summary { font-size:14px; }
  .pending-hd .summary .eta { font-size:10px; display:block; margin-left:0; }
  .pq-row { grid-template-columns:60px minmax(0,1fr) auto 32px;
    grid-template-areas:"stamp name eta act" "meter meter meter meter";
    gap:8px 12px; padding:10px 12px; }
  .pq-stamp { grid-area:stamp; font-size:8.5px; padding:3px 6px; }
  .pq-name { grid-area:name; gap:8px; }
  .pq-name .model { font-size:14px; }
  .pq-name .kindchip { font-size:7.5px; padding:2px 4px; }
  .pq-meter { grid-area:meter; }
  .pq-eta { grid-area:eta; font-size:10px; }
  .pq-act { grid-area:act; opacity:1; }
  .pq-err { grid-area:meter; white-space:normal; }
  .pq-row.running .pq-eta .step { font-size:8.5px; letter-spacing:.18em; }
  .pq-row.queued .pq-meter { display:none; }
  .pq-row.queued { grid-template-areas:"stamp name eta act"; }

  /* Tabs — equal-width touch targets */
  .tabs { border-top:1px solid var(--line); margin-top:14px; }
  .tab { flex:1; justify-content:center; padding:14px 6px 12px; font-size:10px;
    letter-spacing:.2em; gap:6px; }
  .tab .count { font-size:10px; }

  /* Toolbar — full-width search; 16px input prevents iOS zoom-on-focus */
  .toolbar { padding:10px 12px 12px; }
  .search input { font-size:16px; }

  /* Grid — fixed 2-up */
  .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; padding:10px; }

  /* Cards — tighter chrome; actions stay visible (no hover on touch) */
  .card .body { padding:8px 10px 10px; }
  .card .name { font-size:13px; }
  .card .meta-row { font-size:9.5px; margin-top:3px; gap:6px; }
  .card .typestamp { font-size:8px; padding:2px 5px; }
  .card .play svg { width:40px; height:40px; }
  .card .thumb-actions { opacity:1; }
  .card .thumb-actions button { width:30px; height:30px; }

  /* Modal — full-screen vertical sheet */
  .scrim { background:var(--ink); }
  .modal { margin:0; width:100%; height:100dvh; border:0; max-width:none;
    grid-template-columns:1fr; grid-template-rows:auto minmax(0,1fr); }
  .modal .stage { padding:0; min-height:32vh; max-height:56vh; }
  .modal .stage img, .modal .stage video { max-height:56vh; }
  .modal .stage .nav { width:38px; height:38px; font-size:18px; }
  .modal .stage .nav.prev { left:10px; }
  .modal .stage .nav.next { right:10px; }
  .modal .info { border-left:0; border-top:1px solid var(--line);
    min-height:0; overflow:hidden; }
  .modal .info-head { padding:14px 16px 12px; }
  .modal .info-head h2 { font-size:19px; }
  .modal .info .close { top:10px; right:10px; width:36px; height:36px; }
  .modal .info-body { padding:14px 16px 24px; }
  .modal .field { grid-template-columns:92px 1fr; gap:12px; padding:8px 0; }
  .modal .section-ttl { margin:18px 0 6px; }
  .modal .prompt { font-size:14px; padding:12px; }
  .modal .prompt.neg { font-size:12px; }
  .modal .prompt.muted { font-size:11px; }
  .modal .info-foot { padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    flex-wrap:wrap; gap:8px; }
  .modal .info-foot button { flex:1; padding:11px 10px; justify-content:center; }

  /* Toast — edge-to-edge, clears the iOS home indicator */
  .toast { left:14px; right:14px; transform:none;
    bottom:calc(14px + env(safe-area-inset-bottom)); padding:11px 16px; font-size:14px; }

  /* Empty + pager */
  .empty { padding:56px 20px; }
  .empty .e-title { font-size:22px; }
  .pager { padding:14px 0; }
}

/* Extra-small phones — keep the layout from cramming */
@media (max-width:380px) {
  .hdr .title { font-size:28px; }
  .tab { padding:12px 4px 10px; font-size:9px; letter-spacing:.16em; }
  .tab .count { font-size:9px; }
}
</style>
<script src="config.js"></script>
<script src="auth.js"></script>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="lhs">
      <div class="brand">ComfyUI · Outputs</div>
      <div class="title">Outputs</div>
      <div class="sub">A ledger of generations from this workspace.</div>
    </div>
    <div class="rhs">
      <div id="hdr-count">— files</div>
      <div class="stamp"><span class="dot"></span>Watching</div>
    </div>
  </header>

  <!-- Pending status — kept at the top. -->
  <div id="pending"></div>

  <nav class="tabs" id="tabs">
    <div class="tab active" data-tab="all">All <span class="count" id="ct-all">··</span></div>
    <div class="tab" data-tab="images">Images <span class="count" id="ct-images">··</span></div>
    <div class="tab" data-tab="videos">Videos <span class="count" id="ct-videos">··</span></div>
  </nav>

  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="11" cy="11" r="6.5" /><path d="M20 20l-4.2-4.2" />
      </svg>
      <input id="search" placeholder="Filter by filename…" />
    </div>
    <button id="select-toggle" class="tool-btn" type="button">Select</button>
  </div>

  <div id="pager-top" class="pager pager-top"></div>
  <div id="grid" class="grid"></div>
  <div id="pager" class="pager"></div>
</div>
<script src="viewer.js"></script>
</body>
</html>
