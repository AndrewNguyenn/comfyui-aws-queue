<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Models — ComfyUI AWS Queue</title>
    <link rel="stylesheet" href="comfy-aws-queue.css" />
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="api-shim.js"></script>
  </head>
  <body class="models-page">
    <header>
      <a href="/">← Back to ComfyUI</a>
      <h1>Models</h1>
      <button onclick="window.comfyAuth.signOut()">Sign out</button>
    </header>

    <section id="add-from-civitai">
      <h2>Add from CivitAI</h2>
      <form id="download-form">
        <label>CivitAI URL
          <input type="url" id="civitai-url" placeholder="https://civitai.com/models/12345?modelVersionId=67890" required />
        </label>
        <label>Model type
          <select id="model-type" required>
            <optgroup label="Common">
              <option value="checkpoint">Checkpoint (SD1.5 / SDXL / SD3 fully baked)</option>
              <option value="diffusion_models">Diffusion model (Wan / Flux / raw UNet incl. GGUF)</option>
              <option value="lora">LoRA</option>
              <option value="vae">VAE</option>
              <option value="controlnet">ControlNet</option>
            </optgroup>
            <optgroup label="Text / vision encoders">
              <option value="text_encoders">Text encoder (UMT5 for Wan, T5 for Flux)</option>
              <option value="clip">CLIP (SDXL clip-L / clip-G)</option>
              <option value="clip_vision">CLIP vision (IPAdapter, I2V)</option>
            </optgroup>
            <optgroup label="Auxiliary">
              <option value="upscale">Upscale (ESRGAN, etc.)</option>
              <option value="embedding">Embedding (textual inversion)</option>
              <option value="vae_approx">VAE approx (TAESD)</option>
              <option value="style_models">Style model</option>
              <option value="gligen">GLIGEN</option>
              <option value="hypernetworks">Hypernetwork</option>
              <option value="photomaker">PhotoMaker</option>
              <option value="audio_encoders">Audio encoder</option>
              <option value="model_patches">Model patches</option>
              <option value="unet">UNet (deprecated, use diffusion_models)</option>
            </optgroup>
          </select>
        </label>
        <button type="submit">Download</button>
      </form>
      <p id="download-error" class="error"></p>
    </section>

    <section id="downloads">
      <h2>Active downloads</h2>
      <ul id="download-list"></ul>
    </section>

    <section id="catalog">
      <h2>Catalog</h2>
      <p id="catalog-summary"></p>
      <details open><summary>Filter</summary>
        <select id="type-filter">
          <option value="">all</option>
          <option value="checkpoint">checkpoint</option>
          <option value="lora">lora</option>
          <option value="vae">vae</option>
          <option value="controlnet">controlnet</option>
        </select>
      </details>
      <ul id="model-list"></ul>
    </section>

    <script src="models.js"></script>
  </body>
</html>
